# lint → test (unit + integration) → conformance (protocols, chaos, geo).
#
# Всё, что проверяет корректность, гоняется в CI. Ручными остаются только
# прогоны против настоящих апстримов (conformance-live), нагрузочный тест
# и helm-smoke: им нужны интернет, время и kind соответственно.
stages:
  - lint
  - test
  - conformance

variables:
  GO_IMAGE: "golang:1.26"

.go-cache: &go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.cache/go
  cache:
    key: go-$CI_JOB_NAME
    paths:
      - .cache/go/pkg/mod
      - bin/

lint:
  stage: lint
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - make lint

# The project takes contributions under a DCO sign-off instead of a CLA, and a
# mechanism nobody checks is a mechanism nobody has. Only the commits this
# merge request adds are examined; the history predates the policy.
dco:
  stage: lint
  image: $GO_IMAGE
  rules:
    - if: $CI_MERGE_REQUEST_IID
  script:
    - |
      missing=0
      for commit in $(git rev-list "$CI_MERGE_REQUEST_DIFF_BASE_SHA..HEAD"); do
        if ! git log -1 --format=%B "$commit" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
          echo "missing Signed-off-by: $(git log -1 --oneline "$commit")"
          missing=1
        fi
      done
      if [ "$missing" = 1 ]; then
        echo
        echo "Add it with: git commit --amend -s   (or git rebase --signoff origin/HEAD)"
        echo "What it means: see DCO and CONTRIBUTING.md"
        exit 1
      fi
      echo "every commit is signed off"

# Attribution is a licence obligation, not documentation: a dependency added
# without it is a violation shipped in the next release. The check compares
# the committed notices with what the binaries actually link.
notices:
  stage: lint
  image: $GO_IMAGE
  <<: *go-cache
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 >/dev/null
  script:
    - make notices-check

# Консоль: типы и сборка. Бинарь собирается в conformance-образе, но
# ошибка в TypeScript должна падать здесь, а не в docker build.
ui:
  stage: lint
  image: node:24
  cache:
    key: ui-npm
    paths:
      - ui/node_modules
  script:
    - cd ui && npm ci && npm run typecheck && npm run build

# Провайдер — отдельный Go-модуль: свои build/vet/lint/unit.
terraform-provider:
  stage: lint
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - make terraform-build

test:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - make test

# Интеграционные тесты — единственное, что трогает настоящий PostgreSQL и
# S3: журнал, сходимость реального applier'а, advisory-локи, миграции.
test-integration:
  stage: test
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash make go
  script:
    - make test-integration

# Conformance гоняет docker compose, поэтому джобе нужен Docker.
# Вариант A (активен): docker-in-docker — работает на shared-runner'ах,
#   раннер должен быть privileged.
# Вариант B: shell-runner с установленными docker+compose+bash — уберите
#   image/services/before_script/variables и повесьте тег вашего раннера:
#     tags: [shell-docker]
#     script: [make conformance]
conformance:
  stage: conformance
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash make
  script:
    - make conformance

# Acceptance-тесты Terraform-провайдера против настоящего registry:
# apply с нуля, повторный plan пуст, правка через API — это drift.
terraform-acceptance:
  stage: conformance
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash make
  script:
    - make terraform-test

# Отказы: убийство реплики на лету, падение PostgreSQL, падение апстрима.
conformance-chaos:
  stage: conformance
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash make
  script:
    - make conformance-chaos

# Гео-федерация: репликация, конфликты K1, партиция, бутстрап, потеря сайта.
# Тяжелее остальных (три полных сайта), поэтому с увеличенным таймаутом.
conformance-geo:
  stage: conformance
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  timeout: 45m
  before_script:
    - apk add --no-cache bash make
  script:
    - make conformance-geo
