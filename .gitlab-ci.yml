# CI-заготовка: lint → test → conformance.
stages:
  - lint
  - test
  - conformance

variables:
  GO_IMAGE: "golang:1.26"

.go-cache: &go-cache
  variables:
    GOPATH: $CI_PROJECT_DIR/.cache/go
  cache:
    key: go-$CI_JOB_NAME
    paths:
      - .cache/go/pkg/mod
      - bin/

lint:
  stage: lint
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - make lint

test:
  stage: test
  image: $GO_IMAGE
  <<: *go-cache
  script:
    - make test

# Conformance гоняет docker compose, поэтому джобе нужен Docker.
# Вариант A (активен): docker-in-docker — работает на shared-runner'ах,
#   раннер должен быть privileged.
# Вариант B: shell-runner с установленными docker+compose+bash — уберите
#   image/services/before_script/variables и повесьте тег вашего раннера:
#     tags: [shell-docker]
#     script: [make conformance]
conformance:
  stage: conformance
  image: docker:29
  services:
    - docker:29-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash make
  script:
    - make conformance
