# Registry config used inside the conformance compose stack: blobs in MinIO,
# state in Postgres, feeds proxying the fake upstream.
site:
  name: conformance
  # Composer resolves dist URLs literally, so hosted-URL rewriting needs an
  # absolute base. Clients reach the registry directly on this address; the
  # TLS gateway in front of it exists only because terraform demands HTTPS
  # for service discovery.
  external_url: http://registry:8080

server:
  listen: ":8080"
  shutdown_timeout: 10s

storage:
  type: s3
  s3:
    endpoint: minio:9000
    bucket: registry
    access_key: registry
    secret_key: registry-secret
    use_ssl: false

database:
  dsn: postgres://registry:registry@postgres:5432/registry

feeds:
  - name: test
    format: echo
    upstream: http://fake-upstream
    anonymous: true

  - name: central
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: true

  # Allowlist policy: only com.example:liba may pass.
  - name: guarded
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: true
    policies:
      - name: allowlist
        config:
          allow: ["com.example:liba"]

  # Authentication required (static token / OIDC).
  - name: private
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: false

  - name: tf
    format: terraform
    upstream: http://fake-upstream/terraform-upstream
    anonymous: true

  # Hosted maven feed: publishing is allowed for the CI token identity only.
  - name: hosted
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  # Hosted feed guarded by the license policy (deny GPL).
  - name: licensed
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]
    policies:
      - name: license
        config:
          deny: ["GPL-3.0", "AGPL-*"]

  # Proxy feed that quarantines releases younger than 100 years: every
  # fixture is "too fresh", which makes the age gate observable.
  - name: fresh
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: true
    policies:
      - name: quarantine
        config:
          min_age: 876000h
          on_unknown: deny

  - name: npmjs
    format: npm
    upstream: http://fake-upstream/npm
    anonymous: true

  - name: packagist
    format: composer
    upstream: http://fake-upstream/composer-upstream
    anonymous: true
