# Registry config used inside the conformance compose stack: blobs in MinIO,
# state in Postgres, feeds proxying the fake upstream.
site:
  name: conformance
  # Composer resolves dist URLs literally, so hosted-URL rewriting needs an
  # absolute base. Clients reach the registry directly on this address; the
  # TLS gateway in front of it exists only because terraform demands HTTPS
  # for service discovery.
  external_url: http://registry:8080

server:
  listen: ":8080"
  shutdown_timeout: 10s

storage:
  type: s3
  s3:
    endpoint: minio:9000
    bucket: registry
    access_key: registry
    secret_key: registry-secret
    use_ssl: false

# The configuration document lives in the blob store, which is what lets the
# admin API work across replicas (invariant 8).
config_source:
  type: store

# Who may change the configuration. Same identity patterns as publishers.
admins:
  - "token:ops-*"

database:
  dsn: postgres://registry:registry@postgres:5432/registry

feeds:
  - name: test
    format: echo
    upstream: http://fake-upstream
    anonymous: true

  - name: central
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: true

  # Allowlist policy: only com.example:liba may pass.
  - name: guarded
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: true
    policies:
      - name: allowlist
        config:
          allow: ["com.example:liba"]

  # Authentication required (static token / OIDC).
  - name: private
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: false

  - name: tf
    format: terraform
    upstream: http://fake-upstream/terraform-upstream
    anonymous: true

  # Hosted maven feed: publishing is allowed for the CI token identity only.
  - name: hosted
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  # Hosted feed guarded by the license policy (deny GPL).
  - name: licensed
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]
    policies:
      - name: license
        config:
          deny: ["GPL-3.0", "AGPL-*"]

  # Proxy feed that quarantines releases younger than 100 years: every
  # fixture is "too fresh", which makes the age gate observable.
  - name: fresh
    format: maven
    upstream: http://fake-upstream/maven
    anonymous: true
    policies:
      - name: quarantine
        config:
          min_age: 876000h
          on_unknown: deny

  - name: npmjs
    format: npm
    upstream: http://fake-upstream/npm
    anonymous: true

  - name: packagist
    format: composer
    upstream: http://fake-upstream/composer-upstream
    anonymous: true

  - name: nugetorg
    format: nuget
    upstream: http://fake-upstream/nuget-upstream
    anonymous: true

  # Hosted npm feed for `npm publish`.
  - name: npm-hosted
    format: npm
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  # Hosted maven feed for SNAPSHOT deploys.
  - name: snapshots
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  # Hosted maven feed used by the group scenario, so the group has its own
  # local content independent of what other scenarios publish.
  - name: group-hosted
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  # Hosted NuGet feed: `dotnet nuget push` lands here.
  - name: nuget-hosted
    format: nuget
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  # Groups: one URL over local and proxied content. The hosted member comes
  # first, so an internally published coordinate wins over an upstream one of
  # the same name.
  - name: maven-public
    format: maven
    anonymous: true
    members: [group-hosted, central]

  - name: npm-public
    format: npm
    anonymous: true
    members: [npm-hosted, npmjs]

  - name: nuget-public
    format: nuget
    anonymous: true
    members: [nuget-hosted, nugetorg]

  # Hosted Composer feed and a group over it and the proxy.
  - name: composer-hosted
    format: composer
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  - name: composer-public
    format: composer
    anonymous: true
    members: [composer-hosted, packagist]

  # Terraform: private modules plus the proxied registry behind one group.
  # A module source names a HOST, so a group is the only way a site can
  # serve both — and service discovery therefore points at the group.
  - name: tf-hosted
    format: terraform
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]

  - name: tf-public
    format: terraform
    anonymous: true
    members: [tf-hosted, tf]

  # Redirect mode: cached tarballs are answered with a 302 to a pre-signed
  # MinIO URL instead of being streamed through the registry.
  - name: npm-redirect
    format: npm
    upstream: http://fake-upstream/npm
    anonymous: true
    redirect: true
    redirect_ttl: 5m
