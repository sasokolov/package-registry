# The load balancer a site's replicas sit behind. Round robin with no
# stickiness on purpose: a replica holds nothing a request depends on
# (invariant 3), and if one ever did, this is where it would show up.
upstream registry {
    server registry-1:8080;
    server registry-2:8080;
}

server {
    listen 8080;
    # Image layers and jars are large and the registry streams them; a body
    # limit here is a push that fails at a size nobody configured.
    client_max_body_size 0;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_request_buffering off;

    location / {
        proxy_pass http://registry;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Which replica answered, so "is this really balanced" is one header
        # away instead of a guess.
        add_header X-Replica $upstream_addr always;
    }
}
