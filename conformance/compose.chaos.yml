# Overlay for `make conformance-chaos`: two registry replicas behind an
# nginx load balancer, so killing one mid-install is survivable.
services:
  registry:
    deploy:
      replicas: 2

  lb:
    image: nginx:1.28-alpine
    volumes:
      - ./chaos/lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30
