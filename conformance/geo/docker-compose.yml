name: registry-geo

# Two complete geo sites (eu-1, us-1): each with its own MinIO, PostgreSQL
# and registry, peered over the internal replication API.
networks:
  eu: {}
  us: {}
  ap: {}
  wan: {}

services:
  minio-eu:
    networks: [eu]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-eu:
    networks: [eu]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30

  registry-eu:
    networks: [eu, wan]
    build:
      context: ../..
      dockerfile: conformance/Dockerfile
    hostname: registry-eu
    volumes:
      - ./eu.yaml:/etc/fondaco/config.yaml:ro
      - ./peer-token:/etc/fondaco/peer-token:ro
    depends_on:
      minio-eu: {condition: service_healthy}
      postgres-eu: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  minio-us:
    networks: [us]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-us:
    networks: [us]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30

  registry-us:
    networks: [us, wan]
    build:
      context: ../..
      dockerfile: conformance/Dockerfile
    hostname: registry-us
    volumes:
      - ./us.yaml:/etc/fondaco/config.yaml:ro
      - ./peer-token:/etc/fondaco/peer-token:ro
    depends_on:
      minio-us: {condition: service_healthy}
      postgres-us: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  # Third site, started empty by the bootstrap scenario (profile "third").
  minio-ap:
    networks: [ap]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["third"]
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-ap:
    networks: [ap]
    image: postgres:17-alpine
    profiles: ["third"]
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30

  registry-ap:
    networks: [ap, wan]
    hostname: registry-ap
    profiles: ["third"]
    build:
      context: ../..
      dockerfile: conformance/Dockerfile
    volumes:
      - ./ap.yaml:/etc/fondaco/config.yaml:ro
      - ./peer-token:/etc/fondaco/peer-token:ro
    depends_on:
      minio-ap: {condition: service_healthy}
      postgres-ap: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  client:
    networks: [eu, us, ap]
    image: curlimages/curl:8.12.1
    profiles: ["tools"]
    entrypoint: ["curl"]

  # Real package clients, used to prove that publish forwarding works for
  # the tools people actually run, not just for curl.
  npm-client:
    networks: [eu, us, ap]
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /work

  maven-client:
    networks: [eu, us, ap]
    build: ../clients/maven
    profiles: ["tools"]
    entrypoint: ["mvn"]
    working_dir: /work
    volumes:
      - ./maven:/work-geo:ro
