name: registry-geo

# Two complete geo sites (eu-1, us-1): each with its own MinIO, PostgreSQL
# and registry, peered over the internal replication API.
networks:
  eu: {}
  us: {}
  wan: {}

services:
  minio-eu:
    networks: [eu]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-eu:
    networks: [eu]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30

  registry-eu:
    networks: [eu, wan]
    build:
      context: ../..
      dockerfile: conformance/Dockerfile
    hostname: registry-eu
    volumes:
      - ./eu.yaml:/etc/registry/config.yaml:ro
      - ./peer-token:/etc/registry/peer-token:ro
    depends_on:
      minio-eu: {condition: service_healthy}
      postgres-eu: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  minio-us:
    networks: [us]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres-us:
    networks: [us]
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30

  registry-us:
    networks: [us, wan]
    build:
      context: ../..
      dockerfile: conformance/Dockerfile
    hostname: registry-us
    volumes:
      - ./us.yaml:/etc/registry/config.yaml:ro
      - ./peer-token:/etc/registry/peer-token:ro
    depends_on:
      minio-us: {condition: service_healthy}
      postgres-us: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  client:
    networks: [eu, us]
    image: curlimages/curl:8.12.1
    profiles: ["tools"]
    entrypoint: ["curl"]
