# Geo site ap-1: started empty to exercise snapshot bootstrap.
site:
  name: ap-1
  external_url: http://registry-ap:8080

server:
  listen: ":8080"
  shutdown_timeout: 10s

storage:
  type: s3
  s3:
    endpoint: minio-ap:9000
    bucket: registry
    access_key: registry
    secret_key: registry-secret

database:
  dsn: postgres://registry:registry@postgres-ap:5432/registry

replication:
  enabled: true
  internal_listen: ":8081"
  auth:
    type: bearer
    token_file: /etc/registry/peer-token
  topology: mesh
  nudge: true
  journal_retention: 720h
  max_clock_skew: 5m
  peers:
    - name: eu-1
      url: http://registry-eu:8081
      public_url: http://registry-eu:8080
      pull_interval: 2s
    - name: us-1
      url: http://registry-us:8081
      public_url: http://registry-us:8080
      pull_interval: 2s

feeds:
  - name: homed
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]
    publish_policy: forward:eu-1
    # Lazy: the manifest replicates first and the bytes are fetched from a
    # peer on demand, which is the window peer-fallback exists for.
    replication_mode: lazy
    peer_fallback: true

  - name: shared
    format: maven
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]
    publish_policy: local
    replication_mode: lazy
    peer_fallback: true

  - name: npmhosted
    format: npm
    hosted: true
    anonymous: true
    publishers: ["token:ci-*"]
    publish_policy: forward:eu-1
    replication_mode: lazy
    peer_fallback: true
