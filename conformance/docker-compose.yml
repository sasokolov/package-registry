name: registry-conformance

services:
  registry:
    build:
      context: ..
      dockerfile: conformance/Dockerfile
      args:
        # Conformance builds include the test-only echo format module.
        GO_BUILD_TAGS: conformance
    volumes:
      - ./registry.yaml:/etc/registry/config.yaml:ro
      - registry-data:/data
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  fake-upstream:
    image: nginx:1.28-alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./fake-upstream/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # TLS gateway: terraform requires HTTPS for the registry protocol.
  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./gateway/key.pem:/etc/nginx/certs/key.pem:ro
    networks:
      default:
        aliases:
          - registry.local
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-off curl for scenarios; started explicitly via `docker compose run client`,
  # never by `up` (profile "tools").
  client:
    image: curlimages/curl:8.12.1
    profiles: ["tools"]
    entrypoint: ["curl"]
    volumes:
      # Some scenarios upload a fixture archive rather than building one.
      - ./fixtures:/fixtures:ro

  # Real package-manager clients (profile "tools", started per scenario).
  maven-client:
    build: ./clients/maven
    profiles: ["tools"]
    entrypoint: ["mvn"]
    working_dir: /work
    volumes:
      - ./clients/maven/project:/work:ro
      - ./clients/maven/project-live:/work-live:ro
      - ./clients/maven/project-deploy:/work-deploy:ro
      - ./clients/maven/project-group:/work-group:ro

  npm-client:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./clients/npm/project:/src:ro

  composer-client:
    image: composer:2
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./clients/composer/project:/src:ro

  dotnet-client:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /work
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./clients/dotnet/project:/src:ro
      - ./clients/dotnet/project-lib:/src-lib:ro
      - ./clients/dotnet/project-app:/src-app:ro

  k6:
    image: grafana/k6:0.55.0
    profiles: ["tools"]
    entrypoint: ["k6"]

  terraform-client:
    image: hashicorp/terraform:1.9
    profiles: ["tools"]
    environment:
      SSL_CERT_FILE: /gw/ca.pem
    volumes:
      - ./clients/terraform/project:/src:ro
      - ./gateway/ca.pem:/gw/ca.pem:ro

volumes:
  registry-data:
