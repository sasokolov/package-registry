name: registry-conformance

services:
  registry:
    build:
      context: ..
      dockerfile: conformance/Dockerfile
      args:
        # Conformance builds include the test-only echo format module.
        GO_BUILD_TAGS: conformance
    volumes:
      - ./registry.yaml:/etc/registry/config.yaml:ro
      - registry-data:/data
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  fake-upstream:
    image: nginx:1.28-alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./fake-upstream/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-off curl for scenarios; started explicitly via `docker compose run client`,
  # never by `up` (profile "tools").
  client:
    image: curlimages/curl:8.12.1
    profiles: ["tools"]
    entrypoint: ["curl"]

volumes:
  registry-data:
