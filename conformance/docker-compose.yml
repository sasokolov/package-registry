name: registry-conformance

services:
  registry:
    build:
      context: ..
      dockerfile: conformance/Dockerfile
      args:
        # Conformance builds include the test-only echo format module.
        GO_BUILD_TAGS: conformance
    volumes:
      - ./registry.yaml:/etc/fondaco/config.yaml:ro
      - registry-data:/data
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
      fake-oidc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: registry
      MINIO_ROOT_PASSWORD: registry-secret
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
      POSTGRES_DB: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  fake-upstream:
    image: nginx:1.28-alpine
    volumes:
      - ./fixtures:/usr/share/nginx/html:ro
      - ./fake-upstream/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # A real container registry to proxy. The OCI module's upstream cannot be
  # a directory of files the way the other formats' can: the protocol is a
  # conversation, so the thing on the other side has to be a registry.
  oci-upstream:
    image: registry:2.8.3
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5000/v2/"]
      interval: 2s
      timeout: 2s
      retries: 30

  # TLS gateway: terraform requires HTTPS for the registry protocol.
  # An identity provider, so the console's browser sign-in can be driven end
  # to end rather than mocked at the edges.
  fake-oidc:
    build:
      context: ..
      dockerfile: conformance/fake-oidc/Dockerfile
    environment:
      ISSUER: http://fake-oidc:9099
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9099/.well-known/openid-configuration"]
      interval: 2s
      timeout: 2s
      retries: 30

  gateway:
    image: nginx:1.28-alpine
    volumes:
      - ./gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./gateway/cert.pem:/etc/nginx/certs/cert.pem:ro
      - ./gateway/key.pem:/etc/nginx/certs/key.pem:ro
    networks:
      default:
        aliases:
          - registry.local
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__health"]
      interval: 2s
      timeout: 2s
      retries: 15

  # One-off curl for scenarios; started explicitly via `docker compose run client`,
  # never by `up` (profile "tools").
  client:
    image: curlimages/curl:8.12.1
    profiles: ["tools"]
    entrypoint: ["curl"]
    volumes:
      # Some scenarios upload a fixture archive rather than building one.
      - ./fixtures:/fixtures:ro

  # Real package-manager clients (profile "tools", started per scenario).
  maven-client:
    build: ./clients/maven
    profiles: ["tools"]
    entrypoint: ["mvn"]
    working_dir: /work
    volumes:
      - ./clients/maven/project:/work:ro
      - ./clients/maven/project-live:/work-live:ro
      - ./clients/maven/project-deploy:/work-deploy:ro
      - ./clients/maven/project-group:/work-group:ro

  npm-client:
    image: node:22-alpine
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./clients/npm/project:/src:ro

  # crane speaks the registry protocol without needing a docker daemon, which
  # is what makes it usable inside the compose network. It is the reference
  # implementation's own client, and the same conversation `docker push`
  # carries out.
  crane-client:
    # Pinned by digest because the only tag with a shell in it is a floating
    # one, and a conformance run that silently changes its client is not a
    # conformance run. This is crane :debug as of 2026-07-29.
    image: gcr.io/go-containerregistry/crane:debug@sha256:54b27703e6c602fbd6f95712910e9c8d45d4361a59274bde38aeec943734e424
    profiles: ["tools"]
    entrypoint: ["crane"]

  helm-client:
    image: alpine/helm:3.16.3
    profiles: ["tools"]
    entrypoint: ["helm"]
    environment:
      HELM_CACHE_HOME: /tmp/helm/cache
      HELM_CONFIG_HOME: /tmp/helm/config
      HELM_DATA_HOME: /tmp/helm/data

  composer-client:
    image: composer:2
    profiles: ["tools"]
    working_dir: /work
    volumes:
      - ./clients/composer/project:/src:ro

  dotnet-client:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tools"]
    working_dir: /work
    environment:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
    volumes:
      - ./clients/dotnet/project:/src:ro
      - ./clients/dotnet/project-lib:/src-lib:ro
      - ./clients/dotnet/project-app:/src-app:ro

  k6:
    image: grafana/k6:0.55.0
    profiles: ["tools"]
    entrypoint: ["k6"]

  terraform-client:
    image: hashicorp/terraform:1.9
    profiles: ["tools"]
    environment:
      SSL_CERT_FILE: /gw/ca.pem
    volumes:
      - ./clients/terraform/project:/src:ro
      - ./gateway/ca.pem:/gw/ca.pem:ro

volumes:
  registry-data:
