# TLS-terminating gateway in front of the registry: terraform requires
# HTTPS for the registry protocol. Self-signed test certificate for
# registry.local; clients trust it via SSL_CERT_FILE=ca.pem.
server {
    listen 80;
    server_name _;
    location = /__health {
        return 200 "ok\n";
    }
}

server {
    listen 443 ssl;
    server_name registry.local;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    location / {
        # Resolve lazily via Docker's embedded DNS: the registry container
        # may not exist yet when nginx loads the config.
        resolver 127.0.0.11 valid=10s;
        set $backend http://registry:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }
}
