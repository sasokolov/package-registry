server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    autoindex on;

    location = /__health {
        return 200 "ok\n";
    }

    # Terraform Module Registry v1: the download endpoint answers 204 with
    # X-Terraform-Get pointing at the archive, like a real registry.
    location = /terraform-upstream/v1/modules/testns/mymod/generic/1.0.0/download {
        add_header X-Terraform-Get "/terraform-upstream/archives/mymod-1.0.0.tar.gz";
        return 204;
    }
    location = /terraform-upstream/v1/modules/testns/mymod/generic/2.0.0/download {
        add_header X-Terraform-Get "/terraform-upstream/archives/mymod-2.0.0.tar.gz";
        return 204;
    }
}
