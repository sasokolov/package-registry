# Registry config for `make dev`: registry runs on the host,
# minio and postgres come from the compose stack (project registry-dev).
server:
  listen: "127.0.0.1:8080"
  shutdown_timeout: 10s

storage:
  type: fs
  fs:
    path: ./.devdata

feeds: []

# The dev identity provider from the compose overlay, so the console's browser
# sign-in can be tried locally. It signs everybody in as alice@example.com;
# `admins` is what makes that identity useful once signed in.
auth:
  oidc_issuers:
    - issuer: http://127.0.0.1:9099
      audience: package-registry
      client_id: registry-console

admins:
  - "oidc:alice@example.com"
