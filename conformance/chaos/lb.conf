# Load balancer in front of the registry replicas. Failed upstream attempts
# are retried against the other replica, which is what makes a mid-install
# replica kill survivable for the client.
upstream registry_replicas {
    server registry:8080 max_fails=0;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;
    proxy_connect_timeout 2s;

    location / {
        resolver 127.0.0.11 valid=5s;
        proxy_pass http://registry_replicas;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
