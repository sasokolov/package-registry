# Default values for the registry chart.

image:
  repository: ghcr.io/sasokolov/package-registry
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

replicaCount: 2

# Geo site identity (docs/geo-replication.md). Single-site installs keep the
# default; federation (Phase 7) gives each site its own name.
site:
  name: default
  externalURL: ""    # public base URL; required for composer feeds

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: registry.example.com
  tls:
    enabled: false
    secretName: ""

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: true
  minAvailable: 1

serviceMonitor:
  enabled: false
  interval: 30s
  labels: {}

# Blob storage. S3 credentials come from a Secret, never from values.
storage:
  type: s3          # s3 | fs
  s3:
    endpoint: minio.storage.svc:9000
    bucket: registry
    region: ""
    useSSL: false
    existingSecret: registry-s3        # keys: access_key, secret_key
  fs:
    path: /data
    persistence:
      enabled: false
      size: 100Gi
      storageClassName: ""

# PostgreSQL DSN from a Secret (key: dsn). Empty disables the database:
# reads keep working, publishing and static tokens do not.
database:
  existingSecret: registry-postgres
  secretKey: dsn

auth:
  tokenCacheTTL: 5m
  # OIDC issuers, e.g. GitLab CI id_tokens.
  oidcIssuers: []
  #  - issuer: https://gitlab.example.com
  #    audience: package-registry

# Feed definitions, rendered verbatim into the config (invariant 8:
# configuration is declarative).
feeds:
  - name: maven-central
    format: maven
    upstream: https://repo1.maven.org/maven2
    anonymous: true
  - name: npmjs
    format: npm
    upstream: https://registry.npmjs.org
    anonymous: true

# Geo replication (docs/geo-replication.md). The internal API listens on its
# own port and is reachable only from the declared peers.
replication:
  enabled: false
  internalPort: 8081
  # Port the Service publishes for peers. Expose it to other sites with
  # your own LoadBalancer/Gateway (peers need a routable address); the
  # NetworkPolicy below still restricts who may connect.
  servicePort: 8081
  # Peers allowed to reach the replication listener. At least one of
  # peerCIDRs / peerNamespaceSelector is required when enabled.
  peerCIDRs: []
  peerNamespaceSelector: {}
  auth:
    type: mtls            # mtls (production) or bearer (dev)
    existingSecret: registry-replication  # mtls: ca.crt/tls.crt/tls.key; bearer: token
  journalRetention: 720h
  maxClockSkew: 5m
  nudge: true
  peers: []
  #  - name: us-1
  #    url: https://registry-us.example.com:8443
  #    public_url: https://registry-us.example.com
  #    pull_interval: 10s

# Extra config sections merged into the rendered config.
extraConfig: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
