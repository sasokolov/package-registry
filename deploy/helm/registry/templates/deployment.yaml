apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "registry.fullname" . }}
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "registry.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "registry.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: registry
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The config references credentials as ${VAR} and the registry
          # expands them from the environment itself. Running straight off
          # the mounted file is what keeps hot reload working: the kubelet
          # updates the ConfigMap in place and the process re-reads it.
          args: ["-config", "/etc/registry/config.yaml"]
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.replication.enabled }}
            - name: replication
              containerPort: {{ .Values.replication.internalPort }}
            {{- end }}
          env:
            {{- if eq .Values.storage.type "s3" }}
            - name: REGISTRY_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret }}
                  key: access_key
            - name: REGISTRY_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret }}
                  key: secret_key
            {{- end }}
            {{- with .Values.database.existingSecret }}
            - name: REGISTRY_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ $.Values.database.secretKey }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          # Graceful shutdown: /readyz fails first, in-flight downloads drain.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/registry
              readOnly: true
            {{- if .Values.replication.enabled }}
            - name: replication-auth
              mountPath: /etc/registry/replication
              readOnly: true
            {{- end }}
            {{- if and (eq .Values.storage.type "fs") .Values.storage.fs.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.storage.fs.path }}
            {{- end }}
      terminationGracePeriodSeconds: 60
      volumes:
        - name: config
          configMap:
            name: {{ include "registry.fullname" . }}
        {{- if .Values.replication.enabled }}
        - name: replication-auth
          secret:
            secretName: {{ .Values.replication.auth.existingSecret }}
        {{- end }}
        {{- if and (eq .Values.storage.type "fs") .Values.storage.fs.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "registry.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
