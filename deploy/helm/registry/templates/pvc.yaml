{{- if and (eq .Values.storage.type "fs") .Values.storage.fs.persistence.enabled }}
{{- /* Filesystem storage with more than one replica needs RWX; S3 is the
       supported multi-replica backend (invariant 3). */}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "registry.fullname" . }}-data
  labels:
    {{- include "registry.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: {{ .Values.storage.fs.persistence.size }}
  {{- with .Values.storage.fs.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
{{- end }}
