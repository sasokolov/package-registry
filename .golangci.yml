version: "2"

run:
  timeout: 5m
  # Integration-tagged files are real code with real bugs; linting only the
  # default build left them unchecked.
  build-tags:
    - integration

linters:
  default: standard
  enable:
    - copyloopvar
    - gocritic
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/sasokolov/package-registry
